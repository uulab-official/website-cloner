name: Multi-page source preparation
on:
  workflow_dispatch:
  push:
    branches: [work/prepare-suite]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/prepare-suite
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full repository gate
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/prepare-suite/check.log
      - name: Three-engine batch, relocation, comparison and partial-failure checks
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_PREPARE_SUITE_EVIDENCE_DIR: artifacts/prepare-suite/fixtures
        run: set -o pipefail; node --test tests/prepare-suite.test.mjs tests/prepare-suite-pipeline.test.mjs 2>&1 | tee artifacts/prepare-suite/batch-tests.log
      - name: Owned-source batch with a second route and explicit mobile state
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const suite = JSON.parse(await readFile('suites/uulab-services.json', 'utf8'));
          const menu = suite.cases.find(c => c.sourceActions && c.state === 'menu-open');
          if (!menu) throw new Error('Owned source menu case missing');
          const selected = structuredClone(menu);
          for (const key of ['sourceActions', 'targetActions']) if (selected[key]) selected[key] = path.resolve('suites', selected[key]);
          const input = {schemaVersion:1,sourceOrigin:suite.sourceOrigin,targetOrigin:suite.targetOrigin,defaults:{widths:[390],height:900},cases:[{id:'home',path:'/',targetPath:'/planned-home/'},{id:'services',path:'/services/',widths:[1440,390]},selected]};
          await writeFile('artifacts/prepare-suite/live-input.json', JSON.stringify(input,null,2));
          JS
          npm run prepare:suite -- --manifest artifacts/prepare-suite/live-input.json --out artifacts/prepare-suite/live-batch 2>&1 | tee artifacts/prepare-suite/live.log
      - name: Revision and reviewable source without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/prepare-suite/commit.txt
          node --version > artifacts/prepare-suite/node-version.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/prepare-suite/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: prepare-suite-${{ github.sha }}
          path: artifacts/prepare-suite
          if-no-files-found: error
          retention-days: 14
