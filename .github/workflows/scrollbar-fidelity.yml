name: Scrollbar fidelity
on:
  workflow_dispatch:
  push:
    branches: [work/scrollbar-fidelity, work/scrollbar-init]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/scrollbars
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full regression gate
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/scrollbars/check.log
      - name: Viewport and delayed stylesheet evidence in three engines
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CLONER_CAPTURE_ENGINES: chromium,firefox,webkit
        run: set -o pipefail; node --test tests/viewport-evidence.test.mjs tests/scrollbar-style.test.mjs tests/scrollbar-loading.test.mjs 2>&1 | tee artifacts/scrollbars/viewport-tests.log
      - name: Example interactions in three engines
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run check:browsers -- --out artifacts/scrollbars/browsers 2>&1 | tee artifacts/scrollbars/browsers.log
      - name: Repeat production scrollbar initialization
        if: ${{ !cancelled() }}
        run: |
          npm run build > artifacts/scrollbars/build.log 2>&1
          node scripts/case-studies/probe-uulab-scrollbar-init.mjs artifacts/scrollbars/initialization > artifacts/scrollbars/initialization.log 2>&1
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(fs.readFileSync('artifacts/scrollbars/initialization/probe.json')); const rows=p.rows.filter(r=>r.variant==='baseline'); assert.equal(rows.length,8); assert.ok(rows.every(r=>!r.error && r.allStagesReserveSixPixels),'unaltered production build lost its scrollbar reservation');"
      - name: Source diagnosis and unmodified paired captures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          npm run build > artifacts/scrollbars/build.log 2>&1
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > artifacts/scrollbars/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/services/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          failed=0
          node scripts/case-studies/inspect-uulab-scrollbars.mjs artifacts/scrollbars/inspection > artifacts/scrollbars/inspection.log 2>&1 || failed=1
          for engine in chromium firefox webkit; do
            node scripts/verify-suite.mjs --manifest suites/uulab-services.json --browser "$engine" --out "artifacts/scrollbars/live/$engine" > "artifacts/scrollbars/$engine-live.log" 2>&1 || failed=1
          done
          exit "$failed"
      - name: Record revision without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/scrollbars/commit.txt
          node --version > artifacts/scrollbars/node-version.txt
          npm ls --depth=0 > artifacts/scrollbars/dependencies.txt || true
          tar -czf artifacts/scrollbars/code.tar.gz scripts tests examples/uulab-services/src examples/uulab-services/index.html examples/uulab-services/services/index.html package.json .github/workflows/scrollbar-fidelity.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scrollbar-fidelity-${{ github.sha }}
          path: artifacts/scrollbars
          retention-days: 14
