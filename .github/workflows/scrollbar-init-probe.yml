name: Scrollbar initialization probe
on:
  workflow_dispatch:
  push:
    branches: [work/scrollbar-init]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: mkdir -p artifacts/scrollbar-init
      - run: npm run build > artifacts/scrollbar-init/build.log 2>&1
      - run: node scripts/case-studies/probe-uulab-scrollbar-init.mjs artifacts/scrollbar-init > artifacts/scrollbar-init/probe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrollbar-init-${{ github.sha }}
          path: artifacts/scrollbar-init
          retention-days: 14
