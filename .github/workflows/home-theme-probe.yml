name: Homepage theme probe
on:
  workflow_dispatch:
  push:
    branches: [work/home-theme-probe]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p artifacts/home-theme-probe
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - name: Measure stable active dark styles and capture matched views
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > artifacts/home-theme-probe/preview.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for attempt in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/home/ > /dev/null && break || sleep 0.2; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import { normalizeAnimations } from './scripts/lib/settle.mjs';
          const properties=['display','color','backgroundColor','backgroundImage','borderColor','borderWidth','boxShadow','fontSize','fontWeight','lineHeight','letterSpacing','padding','margin','gap','filter','opacity','fill'];
          const browser=await chromium.launch();
          try {
            for(const width of [1440,390]) for(const [side,url] of [['source','https://uulab.co.kr/'],['target','http://127.0.0.1:4173/home/']]) {
              const context=await browser.newContext({viewport:{width,height:900},colorScheme:'light',reducedMotion:'reduce',locale:'ko-KR',timezoneId:'Asia/Seoul'});
              try {
                const page=await context.newPage();await page.goto(url,{waitUntil:'networkidle',timeout:45000});await page.evaluate(()=>document.fonts.ready);await normalizeAnimations(page);
                await page.locator('#darkModeToggle:visible, #darkModeToggleMobile:visible').click();await page.waitForFunction(()=>document.documentElement.classList.contains('dark'));await normalizeAnimations(page);
                const result=await page.evaluate(properties=>({url:location.href,title:document.title,dark:document.documentElement.classList.contains('dark'),width:innerWidth,clientWidth:document.documentElement.clientWidth,height:document.documentElement.scrollHeight,main:document.querySelector('main').outerHTML,rows:[...document.querySelectorAll('body, main, main *')].map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{tag:e.tagName,classes:typeof e.className==='string'?e.className:'',text:e.children.length?null:e.textContent.trim(),rect:{x:r.x,y:r.y,width:r.width,height:r.height},style:Object.fromEntries(properties.map(k=>[k,s[k]]))}})}),properties);
                result.version=browser.version();result.capturedAt=new Date().toISOString();await writeFile(`artifacts/home-theme-probe/${side}-${width}.json`,JSON.stringify(result,null,2));await page.screenshot({path:`artifacts/home-theme-probe/${side}-${width}.png`,animations:'disabled'});
              } finally {await context.close();}
            }
          } finally {await browser.close();}
          NODE
      - if: always()
        run: git rev-parse HEAD > artifacts/home-theme-probe/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: home-theme-probe-${{ github.sha }}
          path: artifacts/home-theme-probe
          retention-days: 14
