name: Homepage theme fidelity
on:
  workflow_dispatch:
  push:
    branches: [work/home-theme-fidelity]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p artifacts/home-theme
      - run: npm ci
      - name: Install selected browser and dependencies
        timeout-minutes: 6
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get install -y fonts-noto-cjk
        timeout-minutes: 3
      - name: Full repository gate
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/home-theme/check.log
      - name: Same authored behavior checks in selected engine
        run: |
          set -o pipefail
          npm run check:browsers -- --browsers ${{ matrix.browser }} --out artifacts/home-theme/browsers 2>&1 | tee artifacts/home-theme/browsers.log
      - name: Fresh source comparisons before and after the scoped CSS repair
        env:
          ENGINE: ${{ matrix.browser }}
        run: |
          set -o pipefail
          css=examples/uulab-services/src/home.css
          git show HEAD:"$css" > artifacts/home-theme/final-home.css
          restore() { cp artifacts/home-theme/final-home.css "$css"; }
          server=''
          trap 'restore; if [ -n "$server" ]; then kill "$server" || true; fi' EXIT
          failed=0
          for phase in baseline final; do
            if [ "$phase" = baseline ]; then git show 9ea7c49c5572025748972b708ff6f438493650c4:"$css" > "$css"; else restore; fi
            sha256sum "$css" > "artifacts/home-theme/$phase-css.sha256"
            npm run build > "artifacts/home-theme/$phase-build.log" 2>&1
            node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > "artifacts/home-theme/$phase-preview.log" 2>&1 &
            server=$!
            for attempt in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/home/ > /dev/null && break || sleep 0.2; done
            for theme in light dark; do
              manifest=suites/uulab-home.json
              if [ "$theme" = dark ]; then manifest=suites/uulab-home-dark.json; fi
              node scripts/verify-suite.mjs --manifest "$manifest" --browser "$ENGINE" --out "artifacts/home-theme/$phase-$theme" > "artifacts/home-theme/$phase-$theme.log" 2>&1 || failed=1
            done
            kill "$server"; wait "$server" || true; server=''
          done
          restore
          git diff --exit-code -- "$css"
          exit "$failed"
      - name: Preserve logs and source snapshot without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/home-theme/commit.txt
          printf '%s\n' '${{ matrix.browser }}' > artifacts/home-theme/engine.txt
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.ttc' --exclude='*.eot' -czf artifacts/home-theme/code.tar.gz AGENTS.md package.json scripts tests suites examples docs .github README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: home-theme-${{ matrix.browser }}-${{ github.sha }}
          path: artifacts/home-theme
          retention-days: 14
