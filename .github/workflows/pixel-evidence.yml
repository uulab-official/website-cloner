name: Exact pixel evidence
on:
  workflow_dispatch:
  push:
    branches: [work/exact-pixel-evidence]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: mkdir -p artifacts/exact
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full regression gate
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/exact/check.log
      - name: Fresh authorized live capture with both pixel metrics
        shell: bash
        run: |
          set -o pipefail
          node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > artifacts/exact/preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/services/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run verify:suite -- --manifest suites/uulab-services.json --out artifacts/exact/live 2>&1 | tee artifacts/exact/live.log
      - name: Record code and toolchain
        if: always()
        run: |
          git rev-parse HEAD > artifacts/exact/commit.txt
          node --version > artifacts/exact/node.txt
          npm ls --depth=0 > artifacts/exact/dependencies.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-pixel-evidence-${{ github.sha }}
          path: artifacts/exact/
          if-no-files-found: error
          retention-days: 14
