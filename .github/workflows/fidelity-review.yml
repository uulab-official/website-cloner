name: Clone fidelity review
# Real source access stays opt-in and outside normal main/PR CI.
on:
  workflow_dispatch:
  push:
    branches: [work/clone-fidelity]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: mkdir -p artifacts/review
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Complete toolkit and production demo check
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/review/check.log
      - name: Fresh viewport, interaction-state and full-page evidence
        shell: bash
        run: |
          set -o pipefail
          node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > artifacts/review/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/services/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run verify:suite -- --manifest suites/uulab-services.json --out artifacts/review/live 2>&1 | tee artifacts/review/live.log
          npm run capture -- --url http://127.0.0.1:4173/services/ --out artifacts/review/short-menu --widths 390 --height 320 --state menu-open-short --actions docs/case-studies/uulab-services/evidence/actions/menu.json 2>&1 | tee artifacts/review/short-menu.log
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          const root = 'artifacts/review';
          await mkdir(`${root}/full-page`, {recursive:true});
          const rows = [];
          let unexpectedFailure = false;
          for (const width of [1440,768,390]) {
            const input = `${root}/live/cases/services-default`;
            const out = `${root}/full-page/${width}`;
            const result = spawnSync(process.execPath, ['scripts/compare.mjs', '--source', `${input}/source/${width}x900/full-page.png`, '--target', `${input}/target/${width}x900/full-page.png`, '--out', out], {encoding:'utf8',timeout:120000,maxBuffer:1048576});
            let report = null;
            try { report = JSON.parse(await readFile(`${out}/report.json`,'utf8')); } catch { /* Keep process diagnostics when no report exists. */ }
            const validDiagnostic = !result.error && !result.signal && ((result.status === 0 && report?.status === 'compared') || (result.status === 1 && report?.status === 'dimension_mismatch'));
            if (!validDiagnostic) unexpectedFailure = true;
            rows.push({width,exitCode:result.status,signal:result.signal,error:result.error?.message || null,stdout:result.stdout,stderr:result.stderr,report});
          }
          const summary = {schemaVersion:1,scope:'default-state full-page PNGs from the successful matched-environment suite',visualGate:'not_requested',functionalParity:'not_verified',reviewRequired:rows.some(row=>row.report?.status!=='compared'),note:'A dimension mismatch is retained as incomparable, with no resizing and no pixel ratio. Workflow completion is not visual approval.',rows};
          await writeFile(`${root}/full-page/summary.json`,JSON.stringify(summary,null,2)+'\n');
          for (const row of rows) console.log(`Full page ${row.width}: ${row.report?.status || 'missing_report'}`);
          if (unexpectedFailure) throw new Error('Unexpected full-page comparison failure; see diagnostics');
          JS
      - name: Record exact code and toolchain
        if: always()
        run: |
          git rev-parse HEAD > artifacts/review/commit.txt
          node --version > artifacts/review/node-version.txt
          npm ls --depth=0 > artifacts/review/dependencies.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clone-fidelity-review-${{ github.sha }}
          path: artifacts/review/
          if-no-files-found: error
          retention-days: 14
