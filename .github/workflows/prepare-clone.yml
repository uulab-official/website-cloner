name: Clone source preparation
on:
  workflow_dispatch:
  push:
    branches: [work/prepare-clone]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/prepare-clone
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full gate including preparation regressions
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/prepare-clone/check.log
      - name: Three engines and target-not-visited checks
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_PREPARE_EVIDENCE_DIR: artifacts/prepare-clone/fixtures
        run: set -o pipefail; node --test tests/prepare-project.test.mjs tests/prepare-recovery.test.mjs tests/prepare-pipeline.test.mjs 2>&1 | tee artifacts/prepare-clone/prepare-tests.log
      - name: Prepare fresh owned-source evidence without a target server
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run prepare:clone -- --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --out artifacts/prepare-clone/live-project 2>&1 | tee artifacts/prepare-clone/live-prepare.log
      - name: Record revision and reviewable code without font files
        if: always()
        run: |
          git rev-parse HEAD > artifacts/prepare-clone/commit.txt
          node --version > artifacts/prepare-clone/node-version.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/prepare-clone/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prepare-clone-${{ github.sha }}
          path: artifacts/prepare-clone
          if-no-files-found: error
          retention-days: 14
