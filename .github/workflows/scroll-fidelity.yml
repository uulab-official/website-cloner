name: FAQ scroll fidelity

# Authorized observation only. Normal CI continues to use local fixtures.
on:
  workflow_dispatch:
  push:
    branches: [work/faq-scroll-fidelity]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: mkdir -p artifacts/scroll
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full regression gate
        shell: bash
        run: npm run check 2>&1 | tee artifacts/scroll/check.log
      - name: Observe scrolling and capture matched source and implementation
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > artifacts/scroll/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/services/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/case-studies/inspect-uulab-scroll.mjs
          npm run verify:suite -- --manifest suites/uulab-services.json --out artifacts/scroll/live 2>&1 | tee artifacts/scroll/live.log
      - name: Preserve source revision and reviewable text snapshot
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > artifacts/scroll/commit.txt
          node --version > artifacts/scroll/node-version.txt
          npm ls --depth=0 > artifacts/scroll/dependencies.txt
          tar -czf artifacts/scroll/code.tar.gz package.json package-lock.json scripts tests examples/uulab-services/src examples/uulab-services/index.html examples/uulab-services/services examples/uulab-services/vite.config.js suites skills AGENTS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faq-scroll-${{ github.sha }}
          path: artifacts/scroll/
          if-no-files-found: error
          retention-days: 14
