name: Stateful source preparation
on:
  workflow_dispatch:
  push:
    branches: [work/preparation-states]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/preparation-states
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full gate
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/preparation-states/check.log
      - name: Three engines, action snapshots and later paired verification
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_STATE_EVIDENCE_DIR: artifacts/preparation-states/fixtures
        run: set -o pipefail; node --test tests/prepare-state.test.mjs tests/prepare-state-pipeline.test.mjs 2>&1 | tee artifacts/preparation-states/state-tests.log
      - name: Owned-source dark menu and FAQ states
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run prepare:clone -- --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --state dark-menu-open --widths 390 --actions docs/case-studies/uulab-services/evidence/actions/dark-menu.json --out artifacts/preparation-states/live-menu 2>&1 | tee artifacts/preparation-states/live-menu.log
          npm run prepare:clone -- --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --state faq-open --widths 1440,390 --keep-scroll --actions docs/case-studies/uulab-services/evidence/actions/faq-live.json --out artifacts/preparation-states/live-faq 2>&1 | tee artifacts/preparation-states/live-faq.log
      - name: Revision and reviewable source without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/preparation-states/commit.txt
          node --version > artifacts/preparation-states/node-version.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/preparation-states/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: preparation-states-${{ github.sha }}
          path: artifacts/preparation-states
          if-no-files-found: error
          retention-days: 14
