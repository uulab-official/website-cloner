name: Live UULab clone evidence

# Normal CI stays local. This dedicated development branch and manual dispatch
# explicitly opt into network capture of the user-owned UULab example.
on:
  workflow_dispatch:
  push:
    branches: [work/paired-live-verification, work/verification-suites]

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - name: Capture real source and local implementation state matrix
        shell: bash
        run: |
          mkdir -p artifacts/live
          node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > artifacts/live/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/services/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run verify:suite -- --config docs/case-studies/uulab-services/verification-suite.json --out artifacts/live/suite
      - name: Preserve evidence even on capture failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-clone-suite-${{ github.sha }}
          path: artifacts/live/
          if-no-files-found: error
          retention-days: 14
