name: Live UULab clone evidence

# Live network access is opt-in. Normal CI continues to use local fixtures.
on:
  workflow_dispatch:
  push:
    branches: [work/paired-live-verification]

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - name: Capture real source and local implementation
        shell: bash
        run: |
          mkdir -p artifacts/live
          node node_modules/vite/bin/vite.js preview examples/uulab-services --outDir ../../dist/demo --host 127.0.0.1 --port 4173 --strictPort > artifacts/live/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/services/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          set +e
          npm run verify -- --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --out artifacts/live/default --widths 1440,768,390 --height 900
          default_status=$?
          npm run verify -- --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --out artifacts/live/menu --widths 390 --height 900 --state menu-open --source-actions docs/case-studies/uulab-services/evidence/actions/menu.json --target-actions docs/case-studies/uulab-services/evidence/actions/menu.json
          menu_status=$?
          printf 'default=%s\nmenu=%s\n' "$default_status" "$menu_status" | tee artifacts/live/exit-status.txt
          test "$default_status" = 0 && test "$menu_status" = 0
      - name: Preserve evidence even on capture failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-clone-evidence-${{ github.sha }}
          path: artifacts/live/
          if-no-files-found: error
          retention-days: 14
