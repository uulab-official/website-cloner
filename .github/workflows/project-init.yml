name: Project initialization
on:
  workflow_dispatch:
  push:
    branches: [work/project-init]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/project-init
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full existing gate with generated-project regressions
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/project-init/check.log
      - name: Generated manifests through three real browser engines
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_INIT_EVIDENCE_DIR: artifacts/project-init/fixtures
        run: set -o pipefail; node --test tests/init.test.mjs tests/init-pipeline.test.mjs 2>&1 | tee artifacts/project-init/init-tests.log
      - name: Existing example behavior in three engines
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run check:browsers -- --out artifacts/project-init/browsers 2>&1 | tee artifacts/project-init/browsers.log
      - name: Initialize and verify the owned live source against the existing clone
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/init.mjs --source https://uulab.co.kr/services/ --target http://127.0.0.1:4173/services/ --out artifacts/project-init/live-project | tee artifacts/project-init/init-live.json
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > artifacts/project-init/preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/services/ > /dev/null; then break; fi
            sleep 0.25
          done
          node scripts/verify-suite.mjs --manifest artifacts/project-init/live-project/suite.json --out artifacts/project-init/live-project/evidence/run-001 2>&1 | tee artifacts/project-init/live.log
      - name: Preserve revision and reviewable source without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/project-init/commit.txt
          node --version > artifacts/project-init/node-version.txt
          npm ls --depth=0 > artifacts/project-init/dependencies.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/project-init/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: project-init-${{ github.sha }}
          path: artifacts/project-init
          if-no-files-found: error
          retention-days: 14
