name: Paired capture engines
on:
  workflow_dispatch:
  push:
    branches: [work/capture-engines-live]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/engines
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full regression gate
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/engines/check.log
      - name: Local capture pipeline in all three engines
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CLONER_CAPTURE_ENGINES: chromium,firefox,webkit
        run: set -o pipefail; node --test tests/capture-engine.test.mjs 2>&1 | tee artifacts/engines/engine-tests.log
      - name: Fresh authorized source and implementation pairs
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > artifacts/engines/preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/services/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          failed=0
          for engine in chromium firefox webkit; do
            node scripts/verify-suite.mjs --manifest suites/uulab-services.json --browser "$engine" --out "artifacts/engines/live/$engine" > "artifacts/engines/$engine-live.log" 2>&1 || failed=1
          done
          exit "$failed"
      - name: Record revision and reviewable source without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/engines/commit.txt
          node --version > artifacts/engines/node-version.txt
          npm ls --depth=0 > artifacts/engines/dependencies.txt || true
          tar -czf artifacts/engines/code.tar.gz scripts tests package.json .github/workflows/capture-engines.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capture-engines-${{ github.sha }}
          path: artifacts/engines
          retention-days: 14
