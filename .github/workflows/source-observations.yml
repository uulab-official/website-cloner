name: Source observations
on:
  workflow_dispatch:
  push:
    branches: [work/source-observations]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/observations
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Complete existing gate and new observations tests
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/observations/check.log
      - name: Capture and observe through three real browser engines
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_OBSERVE_EVIDENCE_DIR: artifacts/observations/fixtures
        run: set -o pipefail; node --test tests/observations.test.mjs tests/observations-settling.test.mjs tests/observe-pipeline.test.mjs 2>&1 | tee artifacts/observations/observe-tests.log
      - name: Observe a fresh capture of the owned live source
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/capture.mjs --url https://uulab.co.kr/services/ --out artifacts/observations/live-source --widths 1440,768,390 --height 900 2>&1 | tee artifacts/observations/live-capture.log
          node scripts/observe.mjs --capture artifacts/observations/live-source --out artifacts/observations/live-report 2>&1 | tee artifacts/observations/live-observe.log
      - name: Render the real observation report for review
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.goto(pathToFileURL(path.resolve('artifacts/observations/live-report/index.html')).href);
            for (const width of [1440,390]) {
              await page.setViewportSize({width,height:900});
              assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
              await page.screenshot({path:`artifacts/observations/report-${width}.png`});
            }
          } finally {await browser.close();}
          JS
      - name: Record revision and reviewable code without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/observations/commit.txt
          node --version > artifacts/observations/node-version.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/observations/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-observations-${{ github.sha }}
          path: artifacts/observations
          if-no-files-found: error
          retention-days: 14
