name: Build readiness
on:
  workflow_dispatch:
  push:
    branches: [work/build-ci-readiness]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/readiness
      - run: npm ci
      - name: Build output regression tests
        run: set -o pipefail; node --test tests/build-output.e2e.mjs 2>&1 | tee artifacts/readiness/build-tests.log
      - run: npx playwright install --with-deps chromium firefox webkit
        if: ${{ !cancelled() }}
      - run: sudo apt-get install -y fonts-noto-cjk
        if: ${{ !cancelled() }}
      - name: Complete existing gate
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/readiness/check.log
      - name: Three-engine production regression
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run check:browsers -- --out artifacts/readiness/browsers 2>&1 | tee artifacts/readiness/browsers.log
      - name: Preserve reviewable evidence without fonts
        if: always()
        run: |
          git rev-parse HEAD > artifacts/readiness/commit.txt
          node --version > artifacts/readiness/node-version.txt
          npm ls --depth=0 > artifacts/readiness/dependencies.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/readiness/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-readiness-${{ github.sha }}
          path: artifacts/readiness
          retention-days: 14
          if-no-files-found: error
