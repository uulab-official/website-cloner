name: Media asset observations
on:
  workflow_dispatch:
  push:
    branches: [work/media-assets]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p artifacts/media-assets
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Full existing gate and new asset regressions
        run: set -o pipefail; npm run check 2>&1 | tee artifacts/media-assets/check.log
      - name: Three-engine media capture and offline report
        if: ${{ !cancelled() }}
        env:
          CAPTURE_TEST_BUNDLED_BROWSER: '1'
          CAPTURE_TEST_ENGINES: chromium,firefox,webkit
          CLONER_MEDIA_EVIDENCE_DIR: artifacts/media-assets/fixtures
        run: set -o pipefail; node --test tests/media-assets.test.mjs tests/media-evidence.test.mjs tests/media-observations.test.mjs tests/media-pipeline.test.mjs 2>&1 | tee artifacts/media-assets/media-tests.log
      - name: Fresh owned-source capture and observations
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run capture -- --url https://uulab.co.kr/services/ --out artifacts/media-assets/live-source --widths 1440,768,390 --height 900 2>&1 | tee artifacts/media-assets/live-capture.log
          npm run observe -- --capture artifacts/media-assets/live-source --out artifacts/media-assets/live-report 2>&1 | tee artifacts/media-assets/live-observe.log
      - name: Record revision and reviewable source without font files
        if: always()
        run: |
          git rev-parse HEAD > artifacts/media-assets/commit.txt
          node --version > artifacts/media-assets/node-version.txt
          git ls-files -z '*.md' '*.mjs' '*.js' '*.json' '*.yml' '*.yaml' '*.html' '.gitignore' | tar --null -T - -czf artifacts/media-assets/code.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: media-assets-${{ github.sha }}
          path: artifacts/media-assets
          if-no-files-found: error
          retention-days: 14
